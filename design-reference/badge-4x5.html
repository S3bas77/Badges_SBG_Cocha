<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge 4:5 — AWS Student Community Day Cochabamba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas-w: 1080px;
    --canvas-h: 1350px;
    --navy-950:#04060d;
    --navy-900:#060a16;
    --navy-800:#0a1224;
    --cyan:#35e7ff;
    --cyan-dim:#1c9db8;
    --cyan-glow:rgba(53,231,255,.5);
    --orange:#ff9900;
    --yellow:#ffce54;
    --white:#ffffff;
    --grey-200:#cddaeb;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    background:#17181c;
    min-height:100vh;
    font-family:'Poppins',sans-serif;
  }

  /* ============ page chrome (outside the badge canvas) ============ */
  .page{
    display:flex; flex-direction:column; align-items:center; gap:18px;
    padding:28px 16px 60px;
  }
  .controls{
    width:100%; max-width:var(--canvas-w);
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:#1f2129; border:1px solid #303342; border-radius:10px;
    padding:14px 18px; color:#d7dbe6; font-size:14px;
  }
  .controls .format-label{ font-weight:600; letter-spacing:.3px; }
  .controls .role-control{ display:flex; align-items:center; gap:10px; }
  .controls select{
    background:#101218; color:#fff; border:1px solid #3a3d4d; border-radius:6px;
    padding:8px 12px; font-family:'Poppins',sans-serif; font-size:14px; cursor:pointer;
  }
  .viewport{
    width:100%; display:flex; align-items:center; justify-content:center;
  }
  .scaler{ position:relative; }

  /* ============ THE BADGE CANVAS — fixed internal coordinate system ============ */
  .canvas{
    position:relative;
    width:var(--canvas-w);
    height:var(--canvas-h);
    transform-origin: top left;
    background:
      radial-gradient(ellipse 900px 600px at 28% 8%, #0d1c34 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 92%, #0a1a2a 0%, transparent 55%),
      var(--navy-950);
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  }

  /* fine grid overlay */
  .canvas::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:54px 54px;
    z-index:0;
  }
  /* vignette */
  .canvas::after{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%);
    z-index:6;
    pointer-events:none;
  }

  /* ---------- decorative watermark: wireframe figure (placeholder) ---------- */
  .watermark{
    position:absolute; left:-40px; top:330px; width:320px; height:700px;
    opacity:.11; z-index:1; pointer-events:none;
  }
  .watermark svg{ width:100%; height:100%; }

  /* ---------- scattered tech squares ---------- */
  .speck{ position:absolute; border:1.5px solid var(--cyan); opacity:.35; z-index:1; }

  /* ---------- corner brackets (yellow -> orange gradient) ---------- */
  .corner{ position:absolute; width:132px; height:132px; z-index:3; }
  .corner .bar{ position:absolute; border-radius:3px; }
  .corner-tl{ top:40px; left:40px; }
  .corner-tl .h{ top:0; left:0; width:132px; height:6px; background:linear-gradient(90deg,var(--yellow),var(--orange)); }
  .corner-tl .v{ top:0; left:0; width:6px; height:132px; background:linear-gradient(180deg,var(--yellow),var(--orange)); }
  .corner-br{ bottom:40px; right:40px; }
  .corner-br .h{ bottom:0; right:0; width:132px; height:6px; background:linear-gradient(270deg,var(--yellow),var(--orange)); }
  .corner-br .v{ bottom:0; right:0; width:6px; height:132px; background:linear-gradient(0deg,var(--yellow),var(--orange)); }

  /* ---------- AWS logo block ---------- */
  /* NOTE: approximated with CSS/SVG. Replace with the official AWS logo asset
     (see explanation at the end of the response) for brand-exact reproduction. */
  .aws-logo{
    position:absolute; top:60px; left:50%; transform:translateX(-50%);
    width:196px; z-index:4; text-align:center;
  }
  .aws-logo .aws-text{
    font-family:'Poppins',sans-serif; font-weight:800; font-size:46px;
    color:var(--white); letter-spacing:-1px; display:block; line-height:1;
  }
  .aws-logo svg{ width:180px; height:34px; margin-top:-2px; }

  /* ---------- STUDENT / COMMUNITY DAY / COCHABAMBA ---------- */
  .label-student{
    position:absolute; top:150px; width:100%; text-align:center; z-index:4;
    font-weight:600; font-size:30px; letter-spacing:10px; color:var(--white);
  }
  .title-main{
    position:absolute; top:182px; width:100%; text-align:center; z-index:4;
    font-weight:900; font-size:92px; line-height:.95; letter-spacing:-1px;
    color:var(--cyan);
    text-shadow: 0 0 18px var(--cyan-glow), 0 0 46px rgba(53,231,255,.3);
  }
  .subtitle-row{
    position:absolute; top:300px; width:100%; z-index:4;
    display:flex; align-items:center; justify-content:center; gap:16px;
  }
  .subtitle-row .orn-line{ width:96px; height:1px; background:var(--cyan); opacity:.55; }
  .subtitle-row .orn-dot{ width:6px; height:6px; border-radius:50%; background:var(--cyan); opacity:.8; }
  .subtitle-row .subtitle{
    font-weight:600; font-size:30px; letter-spacing:8px; color:var(--cyan);
  }

  /* ---------- Photo area ---------- */
  .photo-frame{
    position:absolute; top:352px; left:240px; width:600px; height:600px; z-index:3;
    clip-path: polygon(50px 0, calc(100% - 50px) 0, 100% 50px, 100% calc(100% - 50px), calc(100% - 50px) 100%, 50px 100%, 0 calc(100% - 50px), 0 50px);
    background: linear-gradient(135deg, var(--cyan), #0d6e82);
    padding:3px;
    filter: drop-shadow(0 0 22px var(--cyan-glow)) drop-shadow(0 0 50px rgba(53,231,255,.22));
  }
  .photo-inner{
    width:100%; height:100%; overflow:hidden; background:#0a1420;
    clip-path: polygon(47px 0, calc(100% - 47px) 0, 100% 47px, 100% calc(100% - 47px), calc(100% - 47px) 100%, 47px 100%, 0 calc(100% - 47px), 0 47px);
  }
  /* Placeholder sample photo — production app swaps this for the user's
     crop-to-fill / pan / zoom photo, clipped only by this Photo Area. */
  .photo-inner img{ width:100%; height:100%; object-fit:cover; object-position:50% 22%; display:block; }

  /* ---------- Role banner ---------- */
  .role-banner{
    position:absolute; top:978px; left:240px; width:600px; height:66px; z-index:4;
    border:1px solid rgba(53,231,255,.7);
    background:rgba(53,231,255,.06);
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%);
    display:flex; align-items:center; justify-content:center; gap:22px;
  }
  .role-banner .chevron{ color:var(--cyan); font-weight:700; font-size:20px; letter-spacing:-2px; }
  .role-banner .role-text{
    font-weight:700; font-size:28px; letter-spacing:6px; color:var(--cyan);
  }

  /* ---------- Name ---------- */
  .name-block{
    position:absolute; top:1064px; left:84px; width:820px; z-index:4;
    font-weight:800; font-size:58px; line-height:1.08; color:var(--white);
    letter-spacing:-.5px;
  }

  /* ---------- Footer row ---------- */
  .footer-row{
    position:absolute; top:1218px; left:84px; z-index:4;
    display:flex; align-items:center; gap:18px;
    font-size:23px; color:var(--grey-200); font-weight:500;
  }
  .footer-row .footer-item{ display:flex; align-items:center; gap:10px; }
  .footer-row svg{ width:20px; height:20px; }
  .footer-row .divider{ color:rgba(255,255,255,.3); font-weight:300; }

</style>
</head>
<body>

<div class="page">

  <div class="controls">
    <div class="format-label">Badge 4:5 — 1080 × 1350 px</div>
    <label class="role-control">
      Rol / Título:
      <select id="roleSelect">
        <option value="PARTICIPANTE" selected>Participante</option>
        <option value="ASISTENTE">Asistente</option>
        <option value="VOLUNTARIO">Voluntario</option>
        <option value="VOLUNTARIA">Voluntaria</option>
        <option value="SPEAKER">Speaker</option>
        <option value="ORGANIZADOR">Organizador</option>
        <option value="ORGANIZADORA">Organizadora</option>
      </select>
    </label>
  </div>

  <div class="viewport">
    <div class="scaler" id="scaler">
      <div class="canvas" id="canvas">

        <!-- decorative wireframe watermark (placeholder — see notes) -->
        <div class="watermark">
          <svg viewBox="0 0 200 420" xmlns="http://www.w3.org/2000/svg" stroke="#35e7ff" stroke-width="1" fill="none">
            <circle cx="100" cy="46" r="30"/>
            <line x1="100" y1="76" x2="100" y2="240"/>
            <line x1="100" y1="110" x2="20" y2="180"/>
            <line x1="100" y1="110" x2="180" y2="180"/>
            <line x1="100" y1="240" x2="40" y2="400"/>
            <line x1="100" y1="240" x2="160" y2="400"/>
            <line x1="60" y1="130" x2="140" y2="130"/>
            <line x1="55" y1="170" x2="145" y2="170"/>
          </svg>
        </div>

        <!-- scattered tech specks -->
        <div class="speck" style="top:96px; left:960px; width:14px; height:14px;"></div>
        <div class="speck" style="top:210px; left:1006px; width:9px; height:9px; opacity:.5;"></div>
        <div class="speck" style="top:470px; left:985px; width:11px; height:11px;"></div>
        <div class="speck" style="top:640px; left:1015px; width:16px; height:16px; opacity:.25;"></div>
        <div class="speck" style="top:900px; left:970px; width:10px; height:10px;"></div>
        <div class="speck" style="top:1060px; left:1008px; width:13px; height:13px; opacity:.3;"></div>

        <!-- corner brackets -->
        <div class="corner corner-tl"><div class="bar h"></div><div class="bar v"></div></div>
        <div class="corner corner-br"><div class="bar h"></div><div class="bar v"></div></div>

        <!-- AWS logo (approximated — see explanation for asset replacement) -->
        <div class="aws-logo">
          <span class="aws-text">aws</span>
          <svg viewBox="0 0 210 50" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 16 Q100 56 196 12" stroke="#ff9900" stroke-width="6" fill="none" stroke-linecap="round"/>
            <polygon points="188,2 207,10 190,22" fill="#ff9900"/>
          </svg>
        </div>

        <div class="label-student">STUDENT</div>
        <h1 class="title-main">COMMUNITY DAY</h1>
        <div class="subtitle-row">
          <span class="orn-line"></span><span class="orn-dot"></span>
          <span class="subtitle">COCHABAMBA</span>
          <span class="orn-dot"></span><span class="orn-line"></span>
        </div>

        <!-- Photo Area -->
        <div class="photo-frame">
          <div class="photo-inner">
            <img src="https://picsum.photos/id/1005/900/900" alt="Foto de ejemplo del participante">
          </div>
        </div>

        <!-- Role banner -->
        <div class="role-banner">
          <span class="chevron">«</span>
          <span class="role-text" id="roleText">PARTICIPANTE</span>
          <span class="chevron">»</span>
        </div>

        <!-- Name -->
        <div class="name-block">
          <div>SEBASTIÁN CHACÓN</div>
        </div>

        <!-- Footer -->
        <div class="footer-row">
          <span class="footer-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="#35e7ff" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
            10 October 2026
          </span>
          <span class="divider">|</span>
          <span class="footer-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="#35e7ff" stroke-width="2"><path d="M12 22s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            Cochabamba, Bolivia
          </span>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  function fit(){
    var W = 1080, H = 1350;
    var scale = Math.min((window.innerWidth - 40) / W, (window.innerHeight - 160) / H, 1);
    var canvas = document.getElementById('canvas');
    var scaler = document.getElementById('scaler');
    canvas.style.transform = 'scale(' + scale + ')';
    scaler.style.width = (W * scale) + 'px';
    scaler.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  document.getElementById('roleSelect').addEventListener('change', function(e){
    document.getElementById('roleText').textContent = e.target.value;
  });
</script>
</body>
</html>
